---
layout: default-layout
title: Tools
permalink: /tools/
---
<section class="content">
    <p class="title">
        Here are a few tools we have <br>
        been <span>working on</span>
    </p>
    <div class="tools-container">

        {% for post in site.categories['tool'] %}
        <a href="{{site.baseurl}}{{post.url}}" class="project-card">
            <div style="position: relative;">
                <img src="{{site.baseurl}}{{post.main-img}}" alt="project 1" />
                <div class="img-overlay"></div>
            </div>


            <p class="title">{{ post.title }}</p>
            <p class="subtitle">{{ post.subtitle }}</p>
            <hr>
            <p class="tag">{{ post.tag }}</p>
        </a>
        {% endfor %}

    </div>

</section>

<style>
    .tools-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto;
        padding-top: var(--p5-rem);
        align-items: center;
        gap: var(--p4-rem);
    }

    .tools-container .project-card {
        width: 100%;
        object-fit: cover;

    }

    img {
        max-height: 100%;
        width: auto;
        margin: auto;
        border-radius: 10px;
    }

    @media (max-width: 768px) {
        .tools-container {
            grid-template-columns: 1fr;
        }

        .tools-container .project-card {
            padding: var(--p2-rem) 0;
        }
    }
</style>

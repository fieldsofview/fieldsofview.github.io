---
layout: default
---

<h1>Our Tools</h1>
<div class="tools-grid">
  {% assign tool_pages = site.pages | where_exp: "page", "page.layout == 'tool'" %}
  {% for tool in tool_pages %}
    <div class="tool-card">
      <a href="{{ tool.url }}">
        <img src="{{ tool.thumbnail }}" alt="{{ tool.title }}">
        <p>{{ tool.description }}</p>
      </a>
    </div>
  {% endfor %}
</div>

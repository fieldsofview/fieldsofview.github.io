<!-- Navigation -->

<nav>
    <div class="nav-brand">
        <a href="{{ site.baseurl }}/">
            <div style="width: 220px;">
                {% include logo.html %}
            </div>
        </a>
    </div>
    <ul>
        <li><a href="{{ site.baseurl }}/about/">about</a></li>
        <li><a href="{{ site.baseurl }}/tools/">tools</a></li>
        <li class="group"><a href="{{ site.baseurl }}/resources/">resources</a>
            <div class="dropdown">
                <a href="{{ site.baseurl }}/resources/#publications">publications</a>
                <a href="{{ site.baseurl }}/resources/#newsletter">newsletter</a>
                <a href="{{ site.baseurl }}/resources/#financials">financials</a>
                <a href="{{ site.baseurl }}/resources/#archive">archive</a>
            </div>
        </li>
        <li><a href="{{ site.baseurl }}/get-involved/">get involved</a></li>
    </ul>
</nav>

<style>
    /* ======================================================================================== */
    /* Header Styles */
    /* ======================================================================================== */

    nav {
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        background-color: white;
        padding: 2rem 4rem;
        margin-bottom: 8rem;
        transition: box-shadow 1s ease-in-out;

    }

    nav.scrolled {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    nav ul {
        color: var(--black);
        font-family: "Satoshi", var(--default-font-family);
        font-size: var(--fs25-font-size);
        /* font-size: 1.4rem; */
        font-weight: 500;
        display: flex;
        margin-right: 2rem;
    }

    nav ul li {
        padding: 1.25rem;
        cursor: pointer;
        position: relative;
    }

    nav ul li::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-position: center;
        background-repeat: no-repeat;
        filter: opacity(0);
        transition: filter 0.3s ease-in-out;
        mix-blend-mode: multiply;
        pointer-events: none;
    }

    nav ul li:hover::before {
        filter: opacity(1);
    }

    nav ul li:nth-child(1)::before {
        background-image: url("/img/hover/about-nav.svg");
    }

    nav ul li:nth-child(2)::before {
        background-image: url("/img/hover/tools-bg.svg");
    }

    nav ul li:nth-child(3)::before {
        background-image: url("/img/hover/resources-bg.svg");
    }

    nav ul li:nth-child(4)::before {
        background-image: url("/img/hover/get-involved-bg.svg");
    }

    .dropdown {
        position: absolute;
        left: 0.75rem;
        background-color: white;
        border: 1px solid var(--grey-4);
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
    }

    .group {
        position: relative;
    }

    .group:hover .dropdown {
        opacity: 1;
        visibility: visible;
    }

    .dropdown a {
        display: block;
        padding-left: 1rem;
        padding-right: 1rem;
        padding-top: 0.25rem;
        padding-bottom: 0.25rem;
        font-weight: 400;
        font-size: var(--fs20-font-size);
        transition: background-color 0.2s ease;
    }

    .dropdown a:hover {
        background-color: var(--grey-5);
    }


    /* ======================================================================================== */
    /* Logo Styles */
    /* ======================================================================================== */

    #flip-group {
        transition: 0.2s ease-in-out;
        transform-origin: center;
        transform-box: fill-box;
    }

    .nav-brand:hover #flip-group {
        transform: scaleY(-1);
    }
</style>

<script>
    document.addEventListener('scroll', function () {
        const nav = document.querySelector('nav');
        if (window.scrollY > 50) {
            nav.classList.add('scrolled');
        } else {
            nav.classList.remove('scrolled');
        }
    });
</script>

<!-- Navigation -->
<!-- Navigation -->
<header>
    <div class="nav-brand">
        <a href="{{ site.baseurl }}/" aria-label="Homepage">
            <div style="width: clamp(120px, 20vw, 220px);">
                {% include logo.html %}
            </div>
        </a>
    </div>

    <!-- Mobile nav toggle -->
    <button class="nav-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="main-nav">
        <img src="{{ site.baseurl }}/img/icons/hamburger.svg" alt="">
    </button>

    <nav aria-label="Main navigation">
        <ul id="main-nav">
            <li class="{% if page.url == '/about/' %}active{% endif %}">
                <a href="{{ site.baseurl }}/about/">about</a>
            </li>
            <li class="{% if page.url contains '/tools/' %}active{% endif %}">
                <a href="{{ site.baseurl }}/tools/">tools</a>
            </li>
            <li class="group {% if page.url == '/resources/' %}active{% endif %}">
                <a href="{{ site.baseurl }}/resources/" aria-haspopup="true" aria-expanded="false">
                    resources
                </a>
                <ul class="dropdown" aria-label="submenu">
                    <li><a href="{{ site.baseurl }}/resources/#publications">publications</a></li>
                    <li><a href="{{ site.baseurl }}/resources/#newsletter">newsletter</a></li>
                    <li><a href="{{ site.baseurl }}/resources/#financials">financials</a></li>
                </ul>
            </li>
            <li class="{% if page.url == '/get-involved/' %}active{% endif %}">
                <a href="{{ site.baseurl }}/get-involved/">get involved</a>
            </li>
        </ul>
    </nav>
</header>


<style>
    /* ======================================================================================== */
    /* Header Styles */
    /* ======================================================================================== */

    header {
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        background-color: white;
        padding: var(--p2-rem) var(--p4-rem);
        /* margin-bottom: var(--p8-rem); */
        transition: box-shadow 1s ease-in-out;

    }

    header.scrolled {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    nav>ul {
        color: var(--black);
        font-family: "Satoshi", var(--default-font-family);
        font-size: var(--fs25);
        /* font-size: 1.4rem; */
        font-weight: 500;
        display: flex;
        margin-right: var(--p2-rem);
    }

    nav>ul>li {
        padding: 1.25rem;
        cursor: pointer;
        position: relative;
    }

    nav>ul>li::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-position: center;
        background-repeat: no-repeat;
        filter: opacity(0);
        transition: filter 0.3s ease-in-out;
        mix-blend-mode: multiply;
        pointer-events: none;
    }

    nav>ul>li:hover::before {
        filter: opacity(1);
    }

    nav>ul>li.active::before {
        filter: opacity(1);
    }

    nav>ul>li:nth-child(1)::before {
        background-image: url("/img/hover/about-nav.svg");
    }

    nav>ul>li:nth-child(2)::before {
        background-image: url("/img/hover/tools-bg.svg");
    }

    nav>ul>li:nth-child(3)::before {
        background-image: url("/img/hover/resources-bg.svg");
    }

    nav>ul>li:nth-child(4)::before {
        background-image: url("/img/hover/get-involved-bg.svg");
    }

    .dropdown {
        position: absolute;
        left: 0.75rem;
        background-color: white;
        border: 1px solid var(--grey-4);
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
    }

    .group {
        position: relative;
    }

    .group:hover .dropdown {
        opacity: 1;
        visibility: visible;
    }

    .dropdown a {
        display: block;
        padding-left: 1rem;
        padding-right: 1rem;
        padding-top: 0.25rem;
        padding-bottom: 0.25rem;
        font-weight: 400;
        font-size: var(--fs20);
        transition: background-color 0.2s ease;
    }

    .dropdown a:hover {
        background-color: var(--grey-5);
    }


    /* ======================================================================================== */
    /* Logo Styles */
    /* ======================================================================================== */

    #flip-group {
        transition: 0.2s ease-in-out;
        transform-origin: center;
        transform-box: fill-box;
    }

    .nav-brand:hover #flip-group {
        transform: scaleY(-1);
    }

    .nav-toggle {
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 40px;
        height: 40px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 100;
    }

    .nav-toggle img {
        width: clamp(20px, 3vw, 30px);
    }

    /* Sidebar styles */
    nav>ul {
        transition: transform 0.3s;
    }

    /* .nav-close {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 101;
        display: none;
    }

    .nav-close-btn {
        width: clamp(20px, 3vw, 30px);
        
    } */


    @media (max-width: 900px) {
        .nav-toggle {
            display: flex;
        }

        nav>ul {
            position: fixed;
            top: 0;
            right: 0;
            height: 100vh;
            width: 70vw;
            max-width: 320px;
            background: #fff;
            flex-direction: column;
            align-items: flex-start;
            padding: var(--p4-rem) var(--p2-rem) var(--p2-rem) var(--p2-rem);
            box-shadow: -2px 0 16px rgba(0, 0, 0, 0.08);
            transform: translateX(120%);
            z-index: 99;
        }

        nav>ul.open {
            transform: translateX(10%);
        }

        nav {
            flex-direction: row;
        }

        .group:hover .dropdown {
            opacity: 0;
        }

    }
</style>

<script>
    const navToggle = document.querySelector('.nav-toggle');
    const navMenu = document.querySelector('header>nav>ul');
    const resourcesLink = document.querySelector('.group > a');

    // Sticky header shadow
    document.addEventListener('scroll', function () {
        const nav = document.querySelector('header');
        if (window.scrollY > 50) {
            nav.classList.add('scrolled');
        } else {
            nav.classList.remove('scrolled');
        }
    });

    // Mobile toggle
    navToggle.addEventListener('click', function () {
        const isOpen = navMenu.classList.toggle('open');
        navToggle.setAttribute('aria-expanded', isOpen);
    });

    // Resources submenu (keyboard + toggle support)
    resourcesLink.addEventListener('click', function (e) {
        const expanded = this.getAttribute('aria-expanded') === 'true';
        this.setAttribute('aria-expanded', !expanded);
        const dropdown = this.nextElementSibling;
        dropdown.style.opacity = expanded ? '0' : '1';
        dropdown.style.visibility = expanded ? 'hidden' : 'visible';
    });

</script>
